# Configuration pour Nginx avec SSL pour le frontend de l'application Loom

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name loom.dock localhost;

    ssl_certificate     /etc/nginx/certs/loom.dock.pem;
    ssl_certificate_key /etc/nginx/certs/loom.dock-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /backend/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
